<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Email Search Machine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 12px;
      background: #f8f9fa;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 10px;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <h2>Cari Email Berdasarkan NPM</h2>

  <input id="npmInput" type="text" placeholder="Masukkan NPM">
  <button onclick="searchNPM()">Cari</button>

  <div id="result"></div>

  <script>
    function searchNPM() {
      const npm = document.getElementById("npmInput").value.trim();
      const resultDiv = document.getElementById("result");

      if (!npm) {
        resultDiv.innerHTML = "<b>Masukkan NPM terlebih dahulu.</b>";
        return;
      }

      const apiUrl = "https://script.google.com/macros/s/AKfycbyuPXqiSLmzT8GEuIp6GkIH2QOavWZwGGtYySTUQtMqmYFcE01yAVpWbXGYYqq64kL_qw/exec?npm=" + encodeURIComponent(npm);

      fetch(apiUrl)
        .then(response => response.text())
        .then(html => {
          // API kamu sudah mengembalikan HTML → langsung tampilkan
          resultDiv.innerHTML = html;
        })
        .catch(error => {
          resultDiv.innerHTML = "<b>Terjadi error saat menghubungi API.</b>";
        });
    }
  </script>

</body>
</html>
